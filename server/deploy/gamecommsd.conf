# GameComms endpoint server configuration (gamecommsd -c gamecommsd.conf)

# TCP port for bridges; the same UDP port answers LAN discovery
port = 9888
# Loopback by default; use a secured tunnel for remote bridge connections.
bind = 127.0.0.1
# Set to 1 only when binding to a secured VPN/tunnel interface.
allow_plaintext_network = 0
discovery = 1

# shown to devices in REGISTERED
name = GameComms
# Persistent board file (relative to the server working directory).
# board_file = gamecomms-board.dat
# N-Gage Arena accounts (PPP mode, docs/ARENA.md): created on the first
# login, bound to the N-Gage's IMEI, shared by all Arena games, with their
# profile data; empty: kept in memory only.
# arena_accounts = gamecomms-arena.txt
# Battles, characters and turns of Rifts: Promise of Power's Arena mode;
# empty: kept in memory only.
# rifts_data = gamecomms-rifts.dat
# Pages the Arena menus show (news, support, lists), served by their path
# (DIR/n-gage/device/...); DIR/<game class>/n-gage/... takes priority for
# that game. Example pages: server/deploy/www. Empty: built-in
# placeholders.
# www_root = /etc/gamecomms/www

# Arena over GPRS (docs/ARENA.md): N-Gages that reach this server over the
# internet on their own. The game uses TCP 80, TCP 5222 and UDP 9090; the
# ports below are where the server listens (e.g. 8080 behind a port
# forward 80 -> 8080). Plain text Arena protocols only, like the original
# Arena; the bridge port above is not affected.
# direct = 1
# direct_bind = 0.0.0.0
# direct_http_port = 80
# direct_xmpp_port = 5222
# direct_snap_port = 9090
# direct_idle_ms = 120000

# Required
# ("set key ..." on the bridge console). The key is sent in cleartext and
# does not secure TCP; remote access must use a trusted VPN/tunnel.
# access_key = change-me

max_peers = 512
max_sessions = 256
# queued outbound messages per peer (1 to 4096); allocated as needed
# max_outq = 1024

# keep a silent bridge connection resumable (ms)
link_grace_ms = 20000
# keep the slot of a lost player in a running game (ms)
reserve_ms = 180000
# how long a join may wait for the host's confirmation (ms)
pending_ms = 60000

# abuse limits (see docs/BUILD.md)
hello_timeout_ms = 10000
max_auth_failures = 3
max_conns_per_ip = 16
conn_burst = 10
conn_rate = 2
# per-address limits for loopback clients (local tunnels share 127.0.0.1)
limit_loopback = 0

# 0 errors, 1 warnings, 2 info, 3 debug
log_level = 2
# log_file = /var/log/gamecommsd.log
status_interval = 300
