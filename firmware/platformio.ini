; GameComms ESP32 bridge firmware
;
;   pio run                 build
;   pio run -t upload       flash (see docs/FIRMWARE.md)
;   pio device monitor      configuration console (115200 baud)
;
; Requires an ESP32 with Bluetooth Classic (ESP32-WROOM/WROVER based
; boards, e.g. "esp32dev").  ESP32-S2/S3/C3 have no Bluetooth Classic
; and cannot talk to the N-Gage.

[platformio]
default_envs = esp32dev

[env]
platform      = espressif32
framework     = arduino
monitor_speed = 115200
lib_deps      = symlink://../protocol
build_flags   =
    ; Same message windows as pcbridge, the DLL and the server (16 per link,
    ; 8 per bridge FIFO): smaller windows throttle game traffic and the game
    ; sees send errors and lost connections (tests/parity). To keep internal
    ; RAM for the Wi-Fi and Bluetooth drivers, each queue stores its messages
    ; in the bytes the former 4 slots used (4 x 1094), which limits only
    ; bursts of large messages. Do not set GC_LINK_QUEUE / BRIDGE_FIFO_LEN.
    -DGC_LINK_QBUF=4376
    -DBRIDGE_FIFO_BYTES=4376
    ; PPP mode (retail Arena games): 4 TCP connections with 1.5 kB send
    ; buffers. The buffer also bounds the bytes in flight per connection,
    ; which keeps PPP bursts well inside the 8 kB SPP output queue. MRU and
    ; IP MTU are asked down to 1100 (every TCP segment fits one link message
    ; anyway, and SNAP datagrams stay below 1100), and PPP frames are written
    ; in 256 byte pieces. The PPP state (about 9 kB) lives in the memory of
    ; the GameComms device link (12.4 kB), which Arena games do not use, so
    ; PPP mode needs no heap (main.cpp checks that it fits).
    -DGC_TCP_CONNS=4
    -DGC_TCP_TXBUF=1536
    -DGC_PPP_MRU=1100
    -DGC_IP_MTU=1100
    -DGC_PPP_TXBUF=256
    -DCORE_DEBUG_LEVEL=1
; Bluetooth Classic + Wi-Fi need the larger app partition
board_build.partitions = huge_app.csv

[env:esp32dev]
board = esp32dev

[env:wrover]
board = esp-wrover-kit
